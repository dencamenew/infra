apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: web

resources:
  - namespace.yml
  - local-storage.yml
  - postgres.yml
  - redis.yml
  - mongo.yml
  - fastapi.yml
  - nextapp.yml
  - jobs.yml
  - web-ingress.yml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: postgres-init-sql
    files:
      - init.sql

images:
  - name: gitlab.local:5050/root/terraform/nextapp
    newTag: abc1234
  - name: gitlab.local:5050/root/terraform/fastapi
    newTag: abc1234
  - name: gitlab.local:5050/root/terraform/fill-db
    newTag: abc1234
  - name: gitlab.local:5050/root/terraform/gridfs-loader
    newTag: abc1234