apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
# Static local PVs for the two stateful workloads. Since this is a fixed
# 3-node bare-metal cluster (no cloud provider / no CSI), we pin each PV to
# a specific node instead of relying on a dynamic provisioner.
#
# IMPORTANT: the node names below must match the actual Kubernetes node
# names (check with `kubectl get nodes`). They're assumed to equal the
# libvirt VM hostnames from the README (k8s-worker-1, k8s-worker-2) — adjust
# if your kubeadm bootstrap produced different node names.
#
# IMPORTANT: the host paths below must exist on the target node before the
# pod using them is scheduled. See ansible/deploy-web.yml for the task that
# creates them.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-data-pv
  labels:
    app: postgres
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /var/lib/local-k8s-storage/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker-1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-data-pv
  labels:
    app: mongo-gridfs
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /var/lib/local-k8s-storage/mongo
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker-2